pipeline_name: traffic_flow_ingestion
source:
  name: TomTom
  type: api
  base_url: https://api.tomtom.com
  endpoint: /traffic/services/4/flowSegmentData/absolute/10/json
  parameters:
    point: 41.2357,-8.6199
    key: $TOM_TOM_API_KEY

destinations:
  - type: postgresql
    name: MotherDuck
    host: pg.eu-central-1-aws.motherduck.com
    port: 5432
    database: warehouse
    schema: raw
    table: tomtom_traffic_flow
    username: postgres
    password: $MOTHERDUCK_TOKEN

dead_letter_storage:
  save_failed_records: true
  bucket: $B2_BUCKET_NAME
  endpoint: $B2_ENDPOINT
  access_key: $B2_APPLICATION_KEY
  secret_access_key: $B2_KEY

email:
  send: true
  from: cmmaiaxavier@gmail.com
  password: $EMAIL_PASSWORD
  api_key: $RESEND_API_KEY
  subject: TomTom Traffic Flow Ingestion Pipeline Report
  recipients:
    - cmmaiaxavier@gmail.com
    - xavierkooijman@gmail.com
